name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Enable MSVC (x64)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install "cmake>=3.26,<4.0" ninja pybind11 scikit-build-core
          python -m pip install numpy python-chess tqdm pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Build native extension
        shell: bash
        run: |
          python -m pip install -e . --no-deps
          python -c "from engine import _native; print('native', _native.version())"

      - name: Pytest
        run: python -m pytest tests/ -v --tb=short

      - name: MCTS microbench (native vs Python)
        shell: bash
        run: python scripts/bench_mcts.py --sims 32 --searches 20
