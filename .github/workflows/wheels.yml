# Build manylinux + Windows wheels as CI artifacts (not published to PyPI yet).
# Download from the Actions run → use `pip install path/to/wheel.whl` on Colab/Lightning
# to skip compiling when the platform matches.

name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable MSVC (x64)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install -U pip build
          python -m pip install "cmake>=3.26,<4.0" ninja pybind11 scikit-build-core
          python -m build --wheel
          ls -la dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp311
          path: dist/*.whl
